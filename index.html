<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Orbit</title>
<style>
:root {
  --bg: #0c070c; --panel: #140c14; --panel-2: #1c111b; --line: #2b1b29;
  --text: #f2e8f0; --dim: #8c7889; --faint: #5e4b5b; --pink: #ff4f8b;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; color: var(--text); font-family: var(--sans);
  background: radial-gradient(ellipse 80% 50% at 50% 26%, #2a0f22 0%, var(--bg) 70%) var(--bg); }
main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 32px; }
#orbit { display: block; width: 100%; }

.tape { display: flex; align-items: center; gap: 16px; margin-top: 8px; padding: 12px 16px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: 14px var(--mono); }
.tape .k { color: var(--dim); font-size: 12px; letter-spacing: .08em; }
.tape .t { flex: 1; min-width: 0; overflow: hidden; white-space: pre; text-overflow: ellipsis; }
.cursor { display: inline-block; width: 8px; height: 16px; margin-left: 2px; vertical-align: -3px;
  background: var(--pink); animation: blink 1s steps(1) infinite; }
.live { display: flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 12px; color: var(--pink);
  border: 1px solid var(--pink); border-radius: 6px; background: rgba(255, 79, 139, .08); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
.live.off { color: var(--faint); border-color: var(--faint); background: none; }
.live.off i { animation: none; }

.cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 12px; }
.card { min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-top: 2px solid var(--c);
  border-radius: 8px; background: var(--panel); }
.card .h { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dim); letter-spacing: .06em; }
.card svg { width: 56px; height: 16px; }
.card .v { margin: 8px 0 6px; font: 600 20px var(--mono); color: var(--c); }
.card .s { font-size: 11px; color: var(--faint); }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.panel { min-width: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.panel h2 { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--dim); }
.panel h2 span { font: 400 11px var(--mono); letter-spacing: 0; color: var(--faint); }
#feed { list-style: none; padding: 0; margin-top: 10px; }
#feed li { display: grid; grid-template-columns: 10px 1fr; gap: 2px 10px; padding: 7px 8px; border-radius: 6px; animation: in .35s ease-out; }
#feed li:first-child { background: var(--panel-2); }
#feed .dot { width: 10px; height: 10px; margin-top: 4px; border-radius: 50%; background: var(--c); }
#feed b { font-size: 13px; color: var(--c); }
#feed p { grid-column: 2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
.bar { margin-top: 14px; }
.bar .r { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: var(--dim); }
.bar .r span:last-child { font: 12px var(--mono); }
.track { height: 10px; overflow: hidden; border-radius: 3px; background: #221520; }
.fill { width: 0; height: 100%; border-radius: 3px; transition: width .6s ease; }

@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes in { from { opacity: 0; transform: translateY(-6px); } }
@media (max-width: 820px) { .cards { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, 1fr); } .panels { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <canvas id="orbit" aria-label="에이전트 활동 궤도"></canvas>
  <div class="tape">
    <span class="k">TAPE</span>
    <span class="t"><span id="tape">waiting for agents</span><span class="cursor"></span></span>
    <span class="live off" id="live"><i></i><span>OFFLINE</span></span>
  </div>
  <div class="cards" id="cards"></div>
  <div class="panels">
    <section class="panel"><h2>LIVE VERDICTS <span id="judged">0 events</span></h2><ul id="feed"></ul></section>
    <section class="panel"><h2>WHERE THE WORK GOES</h2><div id="bars"></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const KIND = {
  read: {c: '#9d8cff', code: 'RD'}, edit: {c: '#ff4f8b', code: 'EDT'}, run: {c: '#e04ad6', code: 'RUN'},
  web: {c: '#ffb35c', code: 'WEB'}, sub: {c: '#ffb35c', code: 'SUB'}, tool: {c: '#c08bd9', code: 'TL'},
  say: {c: '#45d6b5', code: 'SAY'}, you: {c: '#f2e8f0', code: 'YOU'}, done: {c: '#45d6b5', code: 'END'},
  error: {c: '#ff6b6b', code: 'ERR'},
};
const TOOL = new Set(['read', 'edit', 'run', 'web', 'sub', 'tool']);
const barKey = k => ['read', 'edit', 'run'].includes(k) ? k : 'other';
const CARDS = [
  ['claude', 'CLAUDE', '#ff4f8b', 'tool calls'],
  ['codex', 'CODEX', '#9d8cff', 'tool calls'],
  ['active', 'ACTIVE', '#e04ad6', 'sessions · 2 min'],
  ['tokens', 'TOKENS', '#45d6b5', 'output tokens'],
  ['turns', 'TURNS', '#ffb35c', 'completed turns'],
  ['errors', 'ERRORS', '#ff6b6b', 'failed · interrupted'],
];
const BARS = [
  ['read', 'read · search', '#9d8cff,#c48cff'],
  ['edit', 'edit · write', '#ff4f8b,#e04ad6'],
  ['run', 'run · exec', '#e04ad6,#b45cff'],
  ['other', 'web · agents · tools', '#ff7a8a,#ffb35c'],
];
$('cards').innerHTML = CARDS.map(([k, n, c, s]) => `<div class="card" style="--c:${c}"><div class="h">${n}<svg viewBox="0 0 56 16"><polyline id="sp-${k}" fill="none" stroke="${c}" stroke-width="1.2"/></svg></div><div class="v" id="v-${k}">0</div><div class="s">${s}</div></div>`).join('');
$('bars').innerHTML = BARS.map(([k, l, g]) => `<div class="bar"><div class="r"><span>${l}</span><span id="p-${k}">0%</span></div><div class="track"><div class="fill" id="f-${k}" style="background:linear-gradient(90deg,${g})"></div></div></div>`).join('');

// ---------- 상태 ----------
const nodes = new Map();  // 세션 id → node (숨김만 하고 지우지 않음: 토큰 누적이 중복되지 않게)
const M = {claude: 0, codex: 0, tokens: 0, turns: 0, errors: 0};
const counts = {read: 0, edit: 0, run: 0, other: 0};
const SPARK_N = 30, spark = Object.fromEntries(CARDS.map(([k]) => [k, Array(SPARK_N).fill(0)]));
const HUB = (new URLSearchParams(location.search).get('hub') || 'HUB').slice(0, 6).toUpperCase();
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IDLE = 120, GONE = 1200;  // 2분 조용하면 흐리게, 20분이면 궤도에서 숨김
let total = 0, lastSeq = 0, boot = null, hubFlash = -9, bursts = [], dirty = true, tapeTimer;
const now = () => performance.now() / 1000;
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const fmtK = x => x >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : x >= 1e3 ? (x / 1e3).toFixed(1) + 'k' : String(x);
const shown = (n, nowS) => nowS - n.last < GONE;

function node(e) {
  let n = nodes.get(e.id);
  if (!n) nodes.set(e.id, n = {id: e.id, agent: e.agent, parent: e.parent, act: '', kind: null, last: e.ts, flash: -9, fail: -9, tokens: 0, off: null, running: new Map()});
  n.label = e.label; n.last = Math.max(n.last, e.ts);
  return n;
}

function onHook(e) {  // 훅: 도구 실행 시작/끝 → 노드 "작업 중" 상태
  const n = node(e);
  if (e.kind === 'start') {
    n.running.set(e.tool, {text: e.text, t: e.ts});
    if (!e.replay) { n.flash = hubFlash = now(); burst(n); tape({label: n.label, text: '▶ ' + e.text}); }
  } else {
    n.running.delete(e.tool);
    if (!e.ok) n.fail = now();
  }
  dirty = true;
}

function onEvent(e) {
  if (e.kind === 'hello') { if (boot && boot !== e.boot) location.reload(); boot = e.boot; return; }
  if (e.kind === 'start' || e.kind === 'end') return onHook(e);
  if (e.seq) { if (e.seq <= lastSeq) return; lastSeq = e.seq; }  // 재연결 시 backlog 중복 제거
  const n = node(e), live = !e.replay, T = SPARK_N - 1;
  if (e.tokens > n.tokens) { M.tokens += e.tokens - n.tokens; if (live) spark.tokens[T] += e.tokens - n.tokens; n.tokens = e.tokens; }
  dirty = true;
  if (e.kind === 'stat') return;
  n.kind = e.kind; n.act = e.text; total++;
  if (TOOL.has(e.kind)) { M[e.agent] = (M[e.agent] || 0) + 1; counts[barKey(e.kind)]++; if (live && spark[e.agent]) spark[e.agent][T]++; }
  if (e.kind === 'error') { M.errors++; if (live) spark.errors[T]++; }
  if (e.kind === 'done') { M.turns++; if (live) spark.turns[T]++; n.running.clear(); }
  if (live) { n.flash = hubFlash = now(); burst(n); }
  tape(e); feed(e);
}

function tape(e) {
  const full = `${e.label}  ${e.text}`;
  clearInterval(tapeTimer);
  if (e.replay || CALM) { $('tape').textContent = full; return; }
  let i = 0;
  tapeTimer = setInterval(() => { i += 2; $('tape').textContent = full.slice(0, i); if (i >= full.length) clearInterval(tapeTimer); }, 16);
}

function feed(e) {
  const li = document.createElement('li'), dot = document.createElement('span'), b = document.createElement('b'), p = document.createElement('p');
  li.style.setProperty('--c', (KIND[e.kind] || KIND.tool).c);
  dot.className = 'dot'; b.textContent = e.kind; p.textContent = `${e.label} · ${e.text}`;  // 로그 내용은 항상 textContent 로
  li.append(dot, b, p); $('feed').prepend(li);
  while ($('feed').children.length > 5) $('feed').lastChild.remove();
}

function activeCount(nowS) { let a = 0; for (const n of nodes.values()) if (nowS - n.last < IDLE) a++; return a; }

function renderPanels() {
  const nowS = Date.now() / 1000;
  const v = {claude: M.claude.toLocaleString(), codex: M.codex.toLocaleString(), active: `${activeCount(nowS)}/${[...nodes.values()].filter(n => shown(n, nowS)).length}`,
    tokens: fmtK(M.tokens), turns: M.turns.toLocaleString(), errors: M.errors.toLocaleString()};
  for (const k in v) $(`v-${k}`).textContent = v[k];
  $('judged').textContent = `${total.toLocaleString()} events`;
  const sum = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  for (const k in counts) { const pc = Math.round(counts[k] / sum * 100); $(`p-${k}`).textContent = pc + '%'; $(`f-${k}`).style.width = pc + '%'; }
}

function tick() {  // 2초마다 스파크라인 한 칸씩 밀기
  const nowS = Date.now() / 1000;
  for (const n of nodes.values()) for (const [id, r] of n.running) if (nowS - r.t > 1800) n.running.delete(id);  // 끝 신호 유실 대비
  spark.active[SPARK_N - 1] = activeCount(nowS);
  for (const k in spark) {
    const a = spark[k], max = Math.max(...a) || 1;
    $(`sp-${k}`).setAttribute('points', a.map((x, i) => `${(i / (SPARK_N - 1) * 56).toFixed(1)},${(14 - x / max * 12).toFixed(1)}`).join(' '));
    a.push(0); a.shift();
  }
  dirty = true;
}
tick(); setInterval(tick, 2000);

// ---------- 캔버스 ----------
const cv = $('orbit'), ctx = cv.getContext('2d');
const css = getComputedStyle(document.documentElement), MONO = css.getPropertyValue('--mono'), SANS = css.getPropertyValue('--sans');
const PAL = ['#ff4f8b', '#ff4f8b', '#e04ad6', '#9d8cff', '#45d6b5', '#ffffff'];
const parts = Array.from({length: 70}, () => ({a: Math.random() * 6.283, sp: (Math.random() * .12 + .03) * (Math.random() < .2 ? -1 : 1), j: (Math.random() - .5) * 14, r: Math.random() * 1.6 + .8, c: PAL[Math.random() * PAL.length | 0]}));
const SPIN = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';
let W = 0, H = 0, Z = 1, stars = [], rot = 0, last = now(), working = false;

function resize() {
  const dpr = devicePixelRatio || 1;
  W = cv.clientWidth; Z = Math.max(.62, Math.min(1, W / 760));  // 좁은 화면: 허브·노드 축소
  H = Math.round(W < 600 ? W * 1.15 : Math.max(340, Math.min(560, W * .62)));
  cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({length: 90}, () => [Math.random() * W, Math.random() * H, Math.random() * .35 + .05]);
}
addEventListener('resize', resize); resize();

const geo = () => ({cx: W / 2, cy: H * .5, rx: W * .41, ry: H * .37});
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
function ellipse(g, k, c, lw) { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(g.cx, g.cy, g.rx * k, g.ry * k, 0, 0, 6.283); ctx.stroke(); }
function rrect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dotOn(g, a, j, r, c, alpha, k = 1) {
  ctx.globalAlpha = alpha; circle(g.cx + (g.rx * k + j) * Math.cos(a), g.cy + (g.ry * k + j * .6) * Math.sin(a), r, c); ctx.globalAlpha = 1;
}

function place(list, k, dt, g) {  // 세션은 궤도 위에 균등 배치, 추가·제거 시 부드럽게 재배치
  list.forEach((n, i) => {
    const target = i / list.length * 6.283;
    if (n.off === null) n.off = target;
    n.off += (target - n.off) * Math.min(1, dt * 3);
    n.a = rot * (k < 1 ? -1.4 : 1) + n.off;
    n.x = g.cx + g.rx * k * Math.cos(n.a); n.y = g.cy + g.ry * k * Math.sin(n.a); n.depth = (Math.sin(n.a) + 1) / 2;
  });
}

function burst(n) {
  const c = (KIND[n.kind] || KIND.tool).c, k = n.parent ? .62 : 1;
  for (let i = 0; i < 7; i++) bursts.push({a: n.a ?? 0, sp: (Math.random() * .9 + .3) * (i % 2 ? 1 : -1), j: (Math.random() - .5) * 10, c, k, t: now()});
}

function drawHub(g, t) {
  const f = Math.max(0, 1 - (t - hubFlash) / .8, working ? (Math.sin(t * 5) + 1) * .3 : 0);
  ctx.save(); ctx.translate(g.cx, g.cy); ctx.scale(Z, Z);
  ctx.strokeStyle = 'rgba(255,79,139,.55)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * 6.283 + .2, r0 = 64, r1 = r0 + 8 + (i % 3) * 6 + f * 10, c = Math.cos(a), s = Math.sin(a) * .9;
    line(c * r0, s * r0, c * r1, s * r1);
    circle(c * r1, s * r1, 2.2, '#ff4f8b');
  }
  ctx.shadowColor = '#ff4f8b'; ctx.shadowBlur = 22 + f * 24;
  rrect(-54, -48, 108, 96, 12, '#1a0c17', '#ff4f8b', 2.5);
  ctx.shadowBlur = 0;
  rrect(-47, -41, 94, 82, 8, null, 'rgba(255,79,139,.35)', 1);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = `700 30px ${SANS}`; ctx.fillText(HUB, 0, 6);
  ctx.fillStyle = '#b79bb0'; ctx.font = `11px ${MONO}`; ctx.fillText('#' + String(total).padStart(4, '0'), 0, 28);
  ctx.restore();
}

function drawNode(n, t, nowS) {
  const work = n.running.size > 0, job = work && [...n.running.values()].pop();
  const s = Z * (.86 + .14 * n.depth), hot = work || t - n.flash < 2.5, failed = t - n.fail < 1.5, k = KIND[n.kind] || KIND.tool;
  const act = job ? `▶ ${n.running.size > 1 ? n.running.size + '× ' : ''}${Math.max(0, Math.floor(nowS - job.t))}s ${job.text}` : n.act || 'idle';
  const title = clip((n.parent ? '↳ ' : '') + n.label, Math.round(24 * Z)), sub = clip(`${n.agent} · ${act}`, Math.round(32 * Z));
  ctx.save(); ctx.globalAlpha = (nowS - n.last > IDLE ? .4 : 1) * (.7 + .3 * n.depth);
  ctx.font = `600 ${14 * s}px ${SANS}`; const w1 = ctx.measureText(title).width;
  ctx.font = `${11 * s}px ${MONO}`; const w2 = ctx.measureText(sub).width;
  const bw = Math.max(w1, w2) + 24 * s, bh = 44 * s;
  const bx = Math.min(Math.max(n.x - bw / 2, 4), W - bw - 34), by = n.y - bh / 2;
  const edge = failed ? '#ff6b6b' : '#ff4f8b';
  if (hot || failed) { ctx.shadowColor = edge; ctx.shadowBlur = work ? 12 + 12 * (Math.sin(t * 6) + 1) / 2 : 18; }
  rrect(bx, by, bw, bh, 6, hot ? 'rgba(60,14,40,.95)' : 'rgba(22,13,21,.92)',
    hot || failed ? edge : n.agent === 'codex' ? 'rgba(157,140,255,.45)' : 'rgba(255,255,255,.16)', hot ? 1.6 : 1);
  ctx.shadowBlur = 0; ctx.textAlign = 'center';
  ctx.fillStyle = '#f2e8f0'; ctx.font = `600 ${14 * s}px ${SANS}`; ctx.fillText(title, bx + bw / 2, by + 19 * s);
  ctx.fillStyle = work ? '#ffb3cf' : '#8c7889'; ctx.font = `${11 * s}px ${MONO}`; ctx.fillText(sub, bx + bw / 2, by + 35 * s);
  if (work || n.kind) {  // 배지: 실행 중엔 스피너, 아니면 마지막 동작 (영상의 SCO / CHO / NOU 박스)
    const x = bx + bw + 6, y = by - 6, c = work ? '#ff4f8b' : k.c;
    rrect(x, y, 24, 14, 2, 'rgba(12,7,12,.9)', c, 1);
    ctx.fillStyle = c; ctx.font = `600 ${work ? 10 : 8}px ${MONO}`; ctx.fillText(work ? SPIN[Math.floor(t * 12) % 10] : k.code, x + 12, y + 10);
  }
  ctx.restore();
}

function frame() {
  const t = now(), dt = Math.min(.1, t - last), nowS = Date.now() / 1000, g = geo();
  last = t; if (!CALM) rot += dt * .03;
  const vis = [...nodes.values()].filter(n => shown(n, nowS)), visSet = new Set(vis);
  place(vis.filter(n => !n.parent), 1, dt, g);
  place(vis.filter(n => n.parent), .62, dt, g);  // 서브에이전트는 안쪽 궤도

  ctx.clearRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(g.cx, g.cy, 0, g.cx, g.cy, g.rx);
  glow.addColorStop(0, 'rgba(255,79,139,.16)'); glow.addColorStop(1, 'rgba(255,79,139,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  for (const [x, y, o] of stars) { ctx.fillStyle = `rgba(255,220,240,${o})`; ctx.fillRect(x, y, 1, 1); }
  ellipse(g, 1, 'rgba(255,79,139,.06)', 20); ellipse(g, 1, 'rgba(255,120,170,.22)', 1);
  ctx.setLineDash([10, 8]); ellipse(g, .62, 'rgba(255,79,139,.35)', 1.2); ctx.setLineDash([]);
  for (const p of parts) { if (!CALM) p.a += p.sp * dt; dotOn(g, p.a, p.j, p.r, p.c, .75); }
  bursts = bursts.filter(b => t - b.t < 1.6);
  for (const b of bursts) { b.a += b.sp * dt; dotOn(g, b.a, b.j, 2.2, b.c, 1 - (t - b.t) / 1.6, b.k); }

  working = false;
  for (const n of vis) {  // 움직인 세션: 허브(서브에이전트면 부모)에서 선. 실행 중이면 선 유지 + 점이 계속 흐름
    const age = t - n.flash, work = n.running.size > 0; if (age > 2.5 && !work) continue;
    working ||= work;
    const par = n.parent && nodes.get(n.parent), from = par && visSet.has(par) ? par : {x: g.cx, y: g.cy};
    ctx.strokeStyle = `rgba(255,79,139,${work ? .85 : (1 - age / 2.5) * .9})`; ctx.lineWidth = 1.5;
    line(from.x, from.y, n.x, n.y);
    const qs = work ? [0, 1, 2].map(i => (t * .9 + i / 3) % 1) : age < .7 ? [age / .7] : [];
    for (const q of qs) circle(from.x + (n.x - from.x) * q, from.y + (n.y - from.y) * q, 3, '#ffd1e3');
  }
  drawHub(g, t);
  vis.sort((a, b) => a.y - b.y).forEach(n => drawNode(n, t, nowS));
  if (!vis.length) {
    ctx.fillStyle = '#8c7889'; ctx.font = `13px ${SANS}`; ctx.textAlign = 'center';
    ctx.fillText(offline ? '로컬 서버에 연결할 수 없습니다 — python3 server.py 실행' : '터미널에서 claude 또는 codex를 실행하면 여기에 나타납니다', g.cx, g.cy + g.ry * .62 + 30);
  }
  if (dirty) { dirty = false; renderPanels(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 스트림 ----------
// 로컬 서버가 직접 띄운 페이지면 같은 출처, 배포된 사이트면 이 브라우저가 돌고 있는 맥의 로컬 서버로
const API = ['127.0.0.1', 'localhost'].includes(location.hostname) ? '' : 'http://127.0.0.1:7777';
const es = new EventSource(API + '/events'), liveEl = $('live');
let offline = false;
es.onopen = () => { offline = false; liveEl.classList.remove('off'); liveEl.lastChild.textContent = 'LIVE'; };
es.onerror = () => { offline = true; liveEl.classList.add('off'); liveEl.lastChild.textContent = 'OFFLINE'; };
es.onmessage = m => onEvent(JSON.parse(m.data));
</script>
