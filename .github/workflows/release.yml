# 릴리스: main 의 커밋에 v<버전> 태그를 push 하면 테스트 → DMG 빌드 → 업데이트 서명 → GitHub 릴리스 → app-version.json 을 main 에
# app-version.json 은 릴리스가 올라온 뒤에 올린다 → 사용자 앱이 아직 없는 DMG 를 받으러 가지 않게
# 서명 비밀 키는 저장소 Secrets 의 EPEIRA_SIGNING_KEY (서명 단계에서만 꺼낸다)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # 릴리스 만들기 · app-version.json 올리기

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # 태그가 main 에 들어갔는지 보려고
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 태그와 버전이 같은지
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./desktop/package.json').version")" = "$V"
          grep -q "^VERSION = '$V'" agent_orbit.py
          grep -q "^const LATEST = '$V';" app.js

      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: 테스트
        run: |
          python3 test_agent_orbit.py
          cd desktop && pnpm test

      - name: DMG 빌드
        working-directory: desktop
        run: pnpm dist --publish never
      - name: 업데이트 서명
        working-directory: desktop
        env:
          KEY: ${{ secrets.EPEIRA_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          EPEIRA_SIGNING_KEY="$RUNNER_TEMP/key.pem" pnpm sign
          rm -f "$RUNNER_TEMP/key.pem"

      - name: 릴리스
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        # main 에 아직 없는 태그(합치기 전 시험)는 초안으로 → 공개 · 최신 릴리스가 되지 않는다. 합친 뒤 gh release edit 로 공개
        run: |
          draft=$(git merge-base --is-ancestor "$GITHUB_SHA" origin/main || echo --draft)
          gh release create "$GITHUB_REF_NAME" dist/Epeira-*.dmg dist/Epeira-*.dmg.sig --verify-tag --title "Epeira ${GITHUB_REF_NAME#v}" --generate-notes $draft
          echo "PUBLISHED=$([ -z "$draft" ] && echo 1)" >> "$GITHUB_ENV"

      # 공개한 릴리스만: app-version.json 을 main 에 올린다 → Vercel 이 배포하면 사용자 앱에 새 버전이 보인다
      - name: 사용자 앱에 새 버전 알리기
        if: env.PUBLISHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do  # 그 사이 main 이 바뀌었으면 다시
            git fetch -q origin main && git checkout -q -B app-version origin/main
            node -e 'const f = "app-version.json", j = JSON.parse(require("fs").readFileSync(f, "utf8")); j.version = process.argv[1]; require("fs").writeFileSync(f, JSON.stringify(j, null, 2) + "\n")' "$V"
            git diff --quiet && exit 0  # 이미 그 버전
            git commit -qam "chore: app-version.json $V ($V)"
            git push -q origin HEAD:main && exit 0
          done
          exit 1
