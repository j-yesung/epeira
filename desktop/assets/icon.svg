<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Agent Orbit 앱 아이콘: macOS 아이콘 격자(824 정사각, 둥근 모서리) 안에 궤도 + HUB -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0d2a52"/>
      <stop offset=".62" stop-color="#071226"/>
      <stop offset="1" stop-color="#040913"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b9eff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3b9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd0ff"/>
      <stop offset="1" stop-color="#3b9eff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#2a4a7a" stroke-opacity=".6"/>
  <circle cx="512" cy="512" r="300" fill="url(#glow)"/>
  <g transform="rotate(-18 512 512)">
    <ellipse cx="512" cy="512" rx="318" ry="150" fill="none" stroke="#3b9eff" stroke-opacity=".35" stroke-width="34" filter="url(#soft)"/>
    <ellipse cx="512" cy="512" rx="318" ry="150" fill="none" stroke="url(#ring)" stroke-width="20"/>
    <circle cx="830" cy="512" r="22" fill="#e7f0ff"/>
    <circle cx="246" cy="430" r="16" fill="#5cc2ff"/>
    <circle cx="402" cy="652" r="13" fill="#a78bfa"/>
  </g>
  <rect x="402" y="402" width="220" height="220" rx="52" fill="#3b9eff" filter="url(#soft)" opacity=".7"/>
  <rect x="402" y="402" width="220" height="220" rx="52" fill="#071428" stroke="#5cc2ff" stroke-width="16"/>
  <rect x="452" y="452" width="120" height="120" rx="30" fill="#3b9eff"/>
</svg>
