<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src http://127.0.0.1:47777; child-src http://127.0.0.1:47777">
<title>Tycho</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="프로젝트">
    <div class="drag side-top">
      <span class="brand"><img src="assets/mark.svg" alt="" width="18" height="18">Tycho</span>
    </div>
    <div class="side-hd">
      <span>PROJECTS</span>
      <button class="icon-btn" id="add-project" type="button" title="폴더 열기 (⌘O)" aria-label="폴더 열기"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <ul class="projects" id="projects"></ul>
    <div class="side-resizer no-drag" id="side-resizer" role="separator" aria-orientation="vertical" aria-label="사이드바 너비"></div>
  </aside>

  <section class="center" aria-label="터미널">
    <div class="tabbar drag">
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="icon-btn no-drag" id="new-shell" type="button" title="새 터미널 탭 (⌘T)" aria-label="새 터미널 탭"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="tab-actions no-drag">
        <button class="btn" id="new-claude" type="button" title="Claude 새 세션 (⇧⌘C)"><span class="k"><img src="assets/claude.svg" alt=""></span><span class="label">Claude</span></button>
        <button class="btn" id="new-codex" type="button" title="Codex 새 세션 (⇧⌘X)"><span class="k"><img src="assets/codex.svg" alt=""></span><span class="label">Codex</span></button>
        <button class="icon-btn" id="toggle-orbit" type="button" title="궤도 패널 (⌘J)" aria-label="궤도 패널 열고 닫기"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><ellipse cx="8" cy="8" rx="6.6" ry="3.7" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="5.7" y="5.7" width="4.6" height="4.6" rx="1.3" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div class="terms" id="terms"></div>
    <div class="welcome" id="welcome">
      <img src="assets/mark.svg" alt="" width="64" height="64">
      <h1>Tycho</h1>
      <p>왼쪽에서 프로젝트를 고르거나 폴더를 추가하세요. 터미널에서 Claude Code · Codex와 대화하면 오른쪽 궤도에 실시간으로 나타나요.</p>
      <div class="welcome-acts" id="welcome-acts"></div>
      <p class="keys"><kbd>⌘O</kbd> 폴더 열기 · <kbd>⌘T</kbd> 새 탭 · <kbd>⇧⌘C</kbd> Claude · <kbd>⇧⌘X</kbd> Codex · <kbd>⌘J</kbd> 궤도 패널</p>
    </div>
  </section>

  <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="궤도 패널 너비"></div>

  <section class="orbit" aria-label="에이전트 궤도">
    <div class="orbit-hd drag">
      <span class="orbit-title" id="orbit-title">ORBIT</span>
      <span class="grow"></span>
      <button class="icon-btn no-drag" id="orbit-big" type="button" title="대시보드 크게 보기" aria-label="대시보드 크게 보기"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6.5 3.5H12.5V9.5M12.5 3.5L4 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <webview id="orbit-view" src="about:blank" partition="persist:orbit" allowpopups hidden></webview>
    <div class="orbit-off" id="orbit-off" hidden></div>
  </section>

  <footer class="statusbar" id="statusbar" role="status" aria-label="연결 상태와 오늘 사용량"></footer>
  <div class="sb-pop" id="sb-pop" role="tooltip" hidden></div>
</div>
<script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="renderer.js"></script>
</body>
</html>
